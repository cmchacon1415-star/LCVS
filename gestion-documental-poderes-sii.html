<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sur Consulting · Gestión Documental (Prototipo)</title>
<style>
:root{
  --bg:#f1f5f9; --sidebar-bg:#ffffff; --card-bg:#ffffff; --border:#e2e8f0; --border-strong:#cbd5e1;
  --text:#1e293b; --text-muted:#64748b; --text-faint:#94a3b8;
  --primary:#2563eb; --primary-dark:#1d4ed8; --primary-light:#eff6ff;
  --success:#16a34a; --success-light:#f0fdf4; --warning:#d97706; --warning-light:#fffbeb;
  --danger:#dc2626; --danger-light:#fef2f2; --radius:14px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
a{color:inherit;}
.hidden{display:none !important;}

/* Layout */
.app{display:flex;min-height:100vh;}
.sidebar{width:76px;background:var(--sidebar-bg);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:16px 0;position:fixed;top:0;bottom:0;left:0;z-index:40;}
.sidebar-logo{width:40px;height:40px;border-radius:10px;background:var(--text);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;letter-spacing:.5px;margin-bottom:22px;}
.sidebar-icons{display:flex;flex-direction:column;gap:8px;flex:1;}
.sidebar-icons.bottom{flex:0;margin-top:auto;}
.side-icon{position:relative;width:48px;height:48px;border-radius:12px;border:none;background:transparent;color:var(--text-muted);display:flex;align-items:center;justify-content:center;transition:background .15s,color .15s;}
.side-icon:hover{background:#f1f5f9;color:var(--text);}
.side-icon.active{background:var(--primary-light);color:var(--primary-dark);}
.side-icon svg{width:22px;height:22px;}
.side-badge{position:absolute;top:2px;right:2px;background:var(--danger);color:#fff;font-size:8px;font-weight:700;padding:1px 4px;border-radius:6px;letter-spacing:.3px;}
.side-pulse{position:absolute;inset:2px;border-radius:12px;box-shadow:0 0 0 0 rgba(37,99,235,.55);animation:pulse 1.8s ease-out 3;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(37,99,235,.55);}70%{box-shadow:0 0 0 8px rgba(37,99,235,0);}100%{box-shadow:0 0 0 0 rgba(37,99,235,0);}}
.side-tooltip{position:absolute;left:60px;top:50%;transform:translateY(-50%);background:#0f172a;color:#fff;font-size:12px;padding:6px 10px;border-radius:8px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s;}
.side-icon:hover .side-tooltip{opacity:1;}

.main{margin-left:76px;flex:1;display:flex;flex-direction:column;min-height:100vh;}
.topbar{height:60px;border-bottom:1px solid var(--border);background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:30;}
.breadcrumb{font-size:13px;color:var(--text-muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.breadcrumb b{color:var(--text);font-weight:600;}
.breadcrumb .crumb-link{cursor:pointer;color:var(--primary);}
.breadcrumb .crumb-link:hover{text-decoration:underline;}
.user-chip{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-muted);}
.user-avatar{width:28px;height:28px;border-radius:50%;background:#e2e8f0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:var(--text);}
.content{flex:1;padding:28px 32px 60px;max-width:980px;width:100%;margin:0 auto;}

.page-title{font-size:22px;font-weight:800;margin:0 0 4px;color:#0f172a;}
.page-subtitle{font-size:14px;color:var(--text-muted);margin:0 0 24px;}

.card{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:24px;box-shadow:0 1px 2px rgba(15,23,42,.04);}
.card + .card{margin-top:16px;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
@media (max-width:720px){.grid-2{grid-template-columns:1fr;}}

.big-cards{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:8px;}
@media (max-width:720px){.big-cards{grid-template-columns:1fr;}}
.big-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:28px;cursor:pointer;transition:border-color .15s,box-shadow .15s,transform .1s;text-align:left;}
.big-card:hover{border-color:var(--primary);box-shadow:0 4px 16px rgba(37,99,235,.10);transform:translateY(-1px);}
.big-card .icon-wrap{width:44px;height:44px;border-radius:12px;background:var(--primary-light);color:var(--primary-dark);display:flex;align-items:center;justify-content:center;margin-bottom:16px;}
.big-card h3{margin:0 0 6px;font-size:16px;font-weight:700;}
.big-card p{margin:0;font-size:13px;color:var(--text-muted);line-height:1.5;}

.btn{display:inline-flex;align-items:center;gap:8px;border-radius:10px;padding:10px 18px;font-size:13.5px;font-weight:600;border:1px solid transparent;transition:.15s;}
.btn-primary{background:var(--primary);color:#fff;}
.btn-primary:hover{background:var(--primary-dark);}
.btn-primary:disabled{background:#93c5fd;cursor:not-allowed;}
.btn-secondary{background:#fff;color:var(--text);border-color:var(--border-strong);}
.btn-secondary:hover{background:#f8fafc;}
.btn-ghost{background:transparent;color:var(--text-muted);}
.btn-ghost:hover{color:var(--text);}
.btn-danger{background:#fff;color:var(--danger);border-color:#fecaca;}
.btn-danger:hover{background:var(--danger-light);}
.btn-sm{padding:6px 12px;font-size:12.5px;border-radius:8px;}
.btn svg{width:15px;height:15px;}

label.field-label{display:block;font-size:12.5px;font-weight:600;color:var(--text);margin-bottom:6px;}
.field-hint{font-size:11.5px;color:var(--text-faint);margin-top:4px;}
.field-error{font-size:11.5px;color:var(--danger);margin-top:4px;display:none;}
.field.invalid .field-error{display:block;}
.field.invalid input,.field.invalid select,.field.invalid .combobox-input{border-color:var(--danger) !important;background:var(--danger-light);}
input[type=text],input[type=date],select,textarea{width:100%;padding:9px 12px;border-radius:9px;border:1px solid var(--border-strong);font-size:13.5px;outline:none;background:#fff;color:var(--text);}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.12);}
textarea{resize:vertical;min-height:64px;}
.field{margin-bottom:16px;}
.row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
@media (max-width:720px){.row-3{grid-template-columns:1fr;}}

/* stepper */
.stepper{display:flex;align-items:center;margin-bottom:26px;}
.stepper-item{flex:1;display:flex;flex-direction:column;align-items:center;position:relative;font-size:11px;font-weight:600;color:var(--text-faint);}
.stepper-item:not(:last-child)::after{content:'';position:absolute;top:16px;left:50%;width:100%;height:2px;background:var(--border);z-index:0;}
.stepper-item.done:not(:last-child)::after{background:var(--primary);}
.stepper-circle{width:32px;height:32px;border-radius:50%;border:2px solid var(--border);background:#fff;display:flex;align-items:center;justify-content:center;z-index:1;margin-bottom:6px;color:var(--text-faint);}
.stepper-item.active .stepper-circle{border-color:var(--primary);color:var(--primary);box-shadow:0 0 0 4px var(--primary-light);}
.stepper-item.active{color:var(--primary-dark);}
.stepper-item.done .stepper-circle{border-color:var(--primary);background:var(--primary);color:#fff;}
.stepper-item.done{color:var(--text);}
.stepper-circle svg{width:14px;height:14px;}
.stepper-label{display:none;}
@media (min-width:640px){.stepper-label{display:block;}}

/* combobox */
.combobox{position:relative;}
.combobox-list{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;border:1px solid var(--border-strong);border-radius:10px;max-height:230px;overflow-y:auto;box-shadow:0 8px 24px rgba(15,23,42,.12);z-index:50;}
.combobox-item{padding:9px 12px;font-size:13px;display:flex;justify-content:space-between;gap:8px;cursor:pointer;}
.combobox-item:hover{background:var(--primary-light);}
.combobox-sub{color:var(--text-faint);font-size:11.5px;white-space:nowrap;}
.combobox-empty{padding:10px 12px;font-size:12.5px;color:var(--text-faint);}

/* option cards (tipo mandante) */
.option-cards{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media (max-width:640px){.option-cards{grid-template-columns:1fr;}}
.option-card{border:2px solid var(--border);border-radius:12px;padding:18px;text-align:left;background:#fff;}
.option-card.selected{border-color:var(--primary);background:var(--primary-light);}
.option-card h4{margin:0 0 4px;font-size:14.5px;}
.option-card p{margin:0;font-size:12.5px;color:var(--text-muted);}

/* client summary */
.summary-box{background:#f8fafc;border:1px solid var(--border);border-radius:12px;padding:16px;margin-top:14px;}
.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 20px;font-size:13px;}
@media (max-width:640px){.summary-grid{grid-template-columns:1fr;}}
.summary-grid dt{color:var(--text-faint);font-size:11px;text-transform:uppercase;letter-spacing:.03em;margin-bottom:2px;}
.summary-grid dd{margin:0;font-weight:600;}

.rep-list{display:flex;flex-direction:column;gap:8px;margin-top:10px;}
.rep-row{display:flex;align-items:center;gap:10px;border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:13px;background:#fff;}
.rep-row.locked{background:#f8fafc;}
.rep-row .rep-name{font-weight:600;flex:1;}
.rep-row .rep-rut{color:var(--text-muted);font-size:12px;}
.rep-row input[type=checkbox],.rep-row input[type=radio]{width:16px;height:16px;}

.banner{border-radius:12px;padding:14px 16px;font-size:13px;display:flex;gap:10px;align-items:flex-start;margin:14px 0;}
.banner svg{width:18px;height:18px;flex-shrink:0;margin-top:1px;}
.banner-warning{background:var(--warning-light);color:#92400e;border:1px solid #fde68a;}
.banner-info{background:var(--primary-light);color:#1e40af;border:1px solid #bfdbfe;}
.banner-success{background:var(--success-light);color:#166534;border:1px solid #bbf7d0;}
.banner-danger{background:var(--danger-light);color:#991b1b;border:1px solid #fecaca;}
.banner-actions{display:flex;gap:8px;margin-top:10px;}

.chip{display:inline-flex;align-items:center;gap:6px;background:var(--primary-light);color:var(--primary-dark);font-size:12px;font-weight:600;padding:5px 10px;border-radius:20px;}
.chip button{background:none;border:none;color:inherit;padding:0;display:flex;}
.chip button svg{width:12px;height:12px;}
.chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}

.checklist{border:1px solid var(--border-strong);border-radius:10px;max-height:230px;overflow-y:auto;}
.checklist-item{display:flex;align-items:center;gap:10px;padding:9px 12px;font-size:13px;border-bottom:1px solid var(--border);}
.checklist-item:last-child{border-bottom:none;}
.checklist-item:hover{background:#f8fafc;}
.checklist-item .name{font-weight:600;flex:1;}
.checklist-item .meta{color:var(--text-faint);font-size:11.5px;}

.footer-nav{display:flex;justify-content:space-between;align-items:center;margin-top:22px;}

/* document preview */
.doc-sheet{background:#fff;border:1px solid var(--border-strong);border-radius:4px;padding:52px 56px;font-family:Georgia,'Times New Roman',serif;font-size:13.5px;line-height:1.7;color:#111827;box-shadow:0 2px 10px rgba(15,23,42,.06);}
.doc-sheet h2{text-align:center;font-size:16px;letter-spacing:.04em;margin:0 0 22px;}
.doc-sheet p{margin:0 0 16px;text-align:justify;}
.doc-fecha{margin-bottom:22px !important;}
.doc-signatures{display:flex;flex-wrap:wrap;gap:40px;margin-top:56px;justify-content:center;}
.doc-signature{text-align:center;font-size:13px;min-width:220px;}
.doc-signature .sigline{border-top:1px solid #111827;margin-bottom:6px;padding-top:6px;}

.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;letter-spacing:.02em;}
.pill-vigente{background:var(--success-light);color:#166534;}
.pill-archivado{background:#f1f5f9;color:var(--text-muted);}

.client-folder{border:1px solid var(--border);border-radius:var(--radius);padding:20px;background:#fff;margin-bottom:14px;}
.client-folder-head{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;}
.client-folder h3{margin:0;font-size:15.5px;}
.poder-meta{font-size:12.5px;color:var(--text-muted);margin-top:6px;display:flex;gap:16px;flex-wrap:wrap;}
.poder-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}
.versions-toggle{margin-top:12px;font-size:12.5px;color:var(--primary);cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:4px;}
.versions-panel{margin-top:10px;border-top:1px dashed var(--border);padding-top:12px;display:flex;flex-direction:column;gap:10px;}
.version-row{background:#f8fafc;border:1px solid var(--border);border-radius:10px;padding:10px 14px;font-size:12.5px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;}

/* modal */
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
.modal{background:#fff;border-radius:16px;max-width:460px;width:100%;padding:24px;box-shadow:0 20px 50px rgba(0,0,0,.25);}
.modal h3{margin:0 0 10px;font-size:16px;}
.modal p{font-size:13.5px;color:var(--text-muted);line-height:1.6;margin:0 0 18px;}
.modal-actions{display:flex;flex-direction:column;gap:8px;}
.modal-actions .btn{justify-content:center;width:100%;}

.toast{position:fixed;bottom:24px;right:24px;background:#0f172a;color:#fff;padding:14px 18px;border-radius:12px;font-size:13.5px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:200;max-width:360px;}
.toast svg{width:18px;height:18px;color:#4ade80;flex-shrink:0;}

.search-bar{position:relative;max-width:360px;margin-bottom:18px;}
.search-bar svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--text-faint);}
.search-bar input{padding-left:36px;}

.empty-state{text-align:center;padding:50px 20px;color:var(--text-muted);}
.empty-state svg{width:40px;height:40px;margin-bottom:12px;color:var(--text-faint);}
</style>
</head>

        <span class="side-tooltip">Configuración</span>

  </aside>

  <!-- MAIN -->
  <div class="main">

      <div class="breadcrumb" id="breadcrumb"></div>
      <div class="user-chip">

    <div class="content" id="content"></div>

/* ============================= UTILS ============================= */

function uid(){ return Math.random().toString(36).slice(2,10); }
function normalize(s){ return (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); }
function escapeHtml(s){ return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function donDona(g){ return g==='F' ? 'Doña' : 'Don'; }

function buildPersonListText(people){
  const items = people.map(p => `${donDona(p.genero)} ${p.nombre}, cédula nacional de identidad N° ${p.rut}`);
  if(items.length===0) return '';
  if(items.length===1) return items[0];
  if(items.length===2) return `${items[0]}, y ${items[1]}`;
  return `${items.slice(0,-1).join(', ')}, y ${items[items.length-1]}`;
}

function pad2(n){ return n<10 ? '0'+n : ''+n; }

function fechaTextoFromISO(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-').map(Number);
  return `${d} de ${MESES[m-1]} de ${y}`;
}
function fechaCortaFromISO(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-').map(Number);
  return `${pad2(d)}-${pad2(m)}-${y}`;
}

function buildDocumentModel({ ciudadFirma, fecha, tipoMandante, cliente, personaNatural, firmantes, mandatarios }){
  const year = fecha ? fecha.slice(0,4) : new Date().getFullYear();
  const fechaTexto = fechaTextoFromISO(fecha);
  const titulo = `PODER SII ${year}`;
  const encabezado = `En ${ciudadFirma}, a ${fechaTexto}.`;

  let parrafo1;
  if(tipoMandante === 'natural'){
    const p = personaNatural;
    parrafo1 = `Comparece ${donDona(p.genero)} ${p.nombre}, cédula nacional de identidad N° ${p.rut}, con domicilio en ${cliente.domicilio}, comuna de ${cliente.comuna}, ${cliente.ciudad}, quien en adelante se denominará el "Mandante".`;
  } else {
    const compareientesText = buildPersonListText(firmantes);
    parrafo1 = `Comparece ${compareientesText}, en representación de la sociedad ${cliente.razonSocial}, Rol Único Tributario N° ${cliente.rut}, con domicilio en ${cliente.domicilio}, comuna de ${cliente.comuna}, ${cliente.ciudad}, quien en adelante se denominará el "Mandante".`;
  }

  const mandatariosText = buildPersonListText(mandatarios);
  const plural = mandatarios.length > 1;
  const verbo = plural ? 'actuando cualquiera de ellos en forma individual e indistinta, representen' : 'represente';
  const parrafo2 = `Por el presente instrumento, el Mandante confiere poder especial a ${mandatariosText}, para que, ${verbo} al Mandante ante el Servicio de Impuestos Internos y demás organismos públicos relacionados, con las facultades que se indican a continuación.`;

  const sujeto = plural ? 'los mandatarios' : 'el mandatario';
  const quedan = plural ? 'quedan' : 'queda';
  const facultado = plural ? 'facultados' : 'facultado';
  const parrafo3 = `En virtud del presente mandato, ${sujeto} ${quedan} ${facultado} para realizar, en nombre y representación del Mandante, todos los trámites necesarios ante el Servicio de Impuestos Internos, entre otros: inicio de actividades, término de giro, presentación y rectificación de declaraciones juradas, formularios y declaraciones de impuestos, solicitudes de modificación de datos, ampliaciones y modificaciones de giro, obtención y cambio de clave tributaria, suscripción de convenios de pago, solicitud de copias de giros y certificados de deudas fiscales, timbraje de documentos tributarios, y en general, todo trámite necesario o conveniente para el correcto cumplimiento de las obligaciones tributarias del Mandante.`;

  const cierre = `Se confieren al mandatario o mandatarios individualizados todas las facultades necesarias para el correcto desempeño del presente mandato, el que no está sujeto a plazo ni condición.`;

  const firmas = (tipoMandante === 'natural' ? [personaNatural] : firmantes).map(f => ({
    nombre: f.nombre,
    ppLine: tipoMandante === 'natural' ? null : `pp. ${cliente.razonSocial}`,
    rutLine: tipoMandante === 'natural' ? f.rut : cliente.rut
  }));

  return { titulo, encabezado, parrafo1, parrafo2, parrafo3, cierre, firmas };
}

/* ============================= PDF GENERATION ============================= */

let __pdfCanvasCtx = null;
function pdfCtx(){
  if(!__pdfCanvasCtx){
    const c = document.createElement('canvas');
    __pdfCanvasCtx = c.getContext('2d');
  }
  return __pdfCanvasCtx;
}
function textWidth(text, size, bold){
  const ctx = pdfCtx();
  ctx.font = `${bold?'bold ':''}${size}px Helvetica, Arial, sans-serif`;
  return ctx.measureText(text).width;
}
function wrapText(text, maxWidth, size, bold){
  const words = text.split(' ');
  const lines = [];
  let cur = '';
  words.forEach(w=>{
    const test = cur ? cur+' '+w : w;
    if(cur && textWidth(test,size,bold) > maxWidth){ lines.push(cur); cur = w; }
    else{ cur = test; }
  });
  if(cur) lines.push(cur);
  return lines;
}
function pdfEscape(s){
  return s.replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)');
}

function buildPdfBinaryString(docModel){
  const PAGE_W = 595.28, PAGE_H = 841.89;
  const MARGIN_X = 64, MARGIN_TOP = 76, MARGIN_BOTTOM = 70;
  const MAX_W = PAGE_W - MARGIN_X*2;

  const blocks = [];
  blocks.push({ text: docModel.titulo, size:15, bold:true, align:'center', spaceAfter:22 });
  blocks.push({ text: docModel.encabezado, size:11, bold:false, align:'left', spaceAfter:18 });
  [docModel.parrafo1, docModel.parrafo2, docModel.parrafo3, docModel.cierre].forEach(p=>{
    blocks.push({ text:p, size:11, bold:false, align:'left', spaceAfter:16 });
  });

  const lines = [];
  blocks.forEach(b=>{
    const wrapped = wrapText(b.text, MAX_W, b.size, b.bold);
    wrapped.forEach((w,i)=>{
      lines.push({ text:w, size:b.size, bold:b.bold, align:b.align, spaceAfter: i===wrapped.length-1 ? b.spaceAfter : 4 });
    });
  });

  // signatures block treated as a unit list appended after main body
  const sigLineHeight = 15;
  const sigBlockHeight = sigLineHeight*3 + 34;

  const pages = [];
  let page = [];
  let y = PAGE_H - MARGIN_TOP;
  const lineHeight = (size)=> size*1.55;

  function newPage(){ pages.push(page); page = []; y = PAGE_H - MARGIN_TOP; }

  lines.forEach(l=>{
    const lh = lineHeight(l.size);
    if(y - lh < MARGIN_BOTTOM){ newPage(); }
    let x = MARGIN_X;
    if(l.align === 'center'){
      const w = textWidth(l.text, l.size, l.bold);
      x = (PAGE_W - w)/2;
    }
    page.push({ text:l.text, x, y, size:l.size, bold:l.bold });
    y -= lh + l.spaceAfter;
  });

  y -= 30;
  docModel.firmas.forEach(f=>{
    if(y - sigBlockHeight < MARGIN_BOTTOM){ newPage(); y -= 10; }
    const startX = MARGIN_X;
    page.push({ text:'_'.repeat(38), x:startX, y, size:11, bold:false });
    y -= lineHeight(11);
    page.push({ text:f.nombre, x:startX, y, size:11, bold:false });
    y -= lineHeight(11);
    if(f.ppLine){
      page.push({ text:f.ppLine, x:startX, y, size:11, bold:false });
      y -= lineHeight(11);
    }
    page.push({ text:f.rutLine, x:startX, y, size:11, bold:false });
    y -= lineHeight(11) + 26;
  });
  if(page.length) pages.push(page);

  return assemblePdf(pages, PAGE_W, PAGE_H);
}

function assemblePdf(pages, w, h){
  const catalogIdx = 1, pagesIdx = 2;
  let nextId = 3;
  const pageIds = [];
  const contentIds = [];
  pages.forEach(()=>{ pageIds.push(nextId++); contentIds.push(nextId++); });
  const fontRegularId = nextId++;
  const fontBoldId = nextId++;

  const kids = pageIds.map(id=>`${id} 0 R`).join(' ');
  const header = `%PDF-1.4\n`;
  const catalogObj = `${catalogIdx} 0 obj\n<< /Type /Catalog /Pages ${pagesIdx} 0 R >>\nendobj\n`;
  const pagesObj = `${pagesIdx} 0 obj\n<< /Type /Pages /Kids [${kids}] /Count ${pageIds.length} >>\nendobj\n`;

  let out = header;
  const offsetsMap = {};
  function push(id, text){ offsetsMap[id] = out.length; out += text; }
  push(catalogIdx, catalogObj);
  push(pagesIdx, pagesObj);
  pages.forEach((page, idx)=>{
    let stream = '';
    page.forEach(item=>{
      const font = item.bold ? '/F2' : '/F1';
      stream += `BT ${font} ${item.size} Tf 1 0 0 1 ${item.x.toFixed(2)} ${item.y.toFixed(2)} Tm (${pdfEscape(item.text)}) Tj ET\n`;
    });
    const pageObj = `${pageIds[idx]} 0 obj\n<< /Type /Page /Parent ${pagesIdx} 0 R /MediaBox [0 0 ${w} ${h}] /Resources << /Font << /F1 ${fontRegularId} 0 R /F2 ${fontBoldId} 0 R >> >> /Contents ${contentIds[idx]} 0 R >>\nendobj\n`;
    const contentObj = `${contentIds[idx]} 0 obj\n<< /Length ${stream.length} >>\nstream\n${stream}endstream\nendobj\n`;
    push(pageIds[idx], pageObj);
    push(contentIds[idx], contentObj);
  });
  const fontRegObj = `${fontRegularId} 0 obj\n<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>\nendobj\n`;
  const fontBoldObj = `${fontBoldId} 0 obj\n<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>\nendobj\n`;
  push(fontRegularId, fontRegObj);
  push(fontBoldId, fontBoldObj);

  const xrefStart = out.length;
  const maxId = fontBoldId;
  let xref = `xref\n0 ${maxId+1}\n0000000000 65535 f \n`;
  for(let i=1;i<=maxId;i++){
    const off = offsetsMap[i] !== undefined ? offsetsMap[i] : 0;
    xref += String(off).padStart(10,'0') + ' 00000 n \n';
  }
  const trailer = `trailer\n<< /Size ${maxId+1} /Root ${catalogIdx} 0 R >>\nstartxref\n${xrefStart}\n%%EOF`;

  return out + xref + trailer;
}

function pdfBase64FromModel(docModel){
  const binStr = buildPdfBinaryString(docModel);
  return btoa(binStr);
}
function binaryStringToUint8(binStr){
  const arr = new Uint8Array(binStr.length);
  for(let i=0;i<binStr.length;i++) arr[i] = binStr.charCodeAt(i) & 0xFF;
  return arr;
}
function blobFromBase64Pdf(base64){
  const binStr = atob(base64);
  return new Blob([binaryStringToUint8(binStr)], { type:'application/pdf' });
}
function triggerDownload(blob, fileName){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = fileName;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}
function openPdfInNewTab(base64){
  const blob = blobFromBase64Pdf(base64);
  const url = URL.createObjectURL(blob);
  window.open(url, '_blank');
  setTimeout(()=>URL.revokeObjectURL(url), 20000);
}

function makeCombobox(container, { items, getLabel, getSub, onSelect, placeholder, initialLabel }){
  container.innerHTML = `<div class="combobox">
    <input type="text" class="combobox-input" placeholder="${escapeHtml(placeholder||'Buscar...')}" autocomplete="off" value="${escapeHtml(initialLabel||'')}">
    <div class="combobox-list hidden"></div>
  </div>`;
  const input = container.querySelector('.combobox-input');
  const list = container.querySelector('.combobox-list');
  function render(filter){
    const f = normalize(filter||'');
    const filtered = items.filter(it => normalize(getLabel(it) + ' ' + (getSub?getSub(it):'')).includes(f)).slice(0,60);
    if(!filtered.length){
      list.innerHTML = '<div class="combobox-empty">Sin resultados</div>';
    } else {
      list.innerHTML = filtered.map((it,i)=>`<div class="combobox-item" data-idx="${i}"><span>${escapeHtml(getLabel(it))}</span>${getSub?`<span class="combobox-sub">${escapeHtml(getSub(it))}</span>`:''}</div>`).join('');
      Array.from(list.querySelectorAll('.combobox-item')).forEach((el,i)=>{
        el.addEventListener('mousedown', e=>{
          e.preventDefault();
          input.value = getLabel(filtered[i]);
          list.classList.add('hidden');
          onSelect(filtered[i]);
        });
      });
    }
    list.classList.remove('hidden');
  }
  input.addEventListener('focus', ()=>render(input.value));
  input.addEventListener('input', ()=>render(input.value));
  input.addEventListener('blur', ()=>setTimeout(()=>list.classList.add('hidden'),150));
  return { setValue:v=>input.value=v };
}

function fieldWrap(id, label, innerHtml, hint){
  return `<div class="field" id="field-${id}">

function renderWizardStep(){
  renderStepper();
  document.getElementById('wizard-prev').classList.toggle('hidden', wizardStep===1);
  document.getElementById('wizard-next').textContent = wizardStep===TOTAL_STEPS ? 'Finalizar' : 'Continuar';
  const container = document.getElementById('wizard-step-container');
  if(wizardStep===1) container.innerHTML = stepDocumento();
  else if(wizardStep===2) container.innerHTML = stepMandante();
  else if(wizardStep===3) container.innerHTML = stepCliente();
  else if(wizardStep===4) container.innerHTML = stepRepresentantes();

  else if(wizardStep===6) container.innerHTML = stepPreview();

}

          <div>${escapeHtml(f.nombre)}</div>
          ${f.ppLine? `<div>${escapeHtml(f.ppLine)}</div>`:''}
          <div>${escapeHtml(f.rutLine)}</div>
        </div>`).join('')}
    </div>
  </div>
  <div class="footer-nav">
    <button class="btn btn-secondary" onclick="wizardStep=5;renderWizardStep();">Anterior</button>
    <button class="btn btn-primary" id="btn-generar-pdf">${iconSvg('fileText')} Generar PDF</button>
  </div>`;
}

function currentDocumentModel(){
  if(!wizard.ciudadFirma || !wizard.fecha || !wizard.tipoMandante || !wizard.clienteId) return null;
  const cliente = getCliente(wizard.clienteId);
  if(!cliente) return null;
  if(wizard.tipoMandante==='natural'){
    if(!wizard.naturalPersonId) return null;
    const persona = getRepresentante(cliente, wizard.naturalPersonId);
    if(!persona) return null;
    if(!wizard.mandatariosSeleccionados.length) return null;
    return buildDocumentModel({
      ciudadFirma: wizard.ciudadFirma, fecha: wizard.fecha, tipoMandante:'natural', cliente, personaNatural: persona,
      mandatarios: wizard.mandatariosSeleccionados.map(getMandatario)
    });
  }
  const firmantesIds = firmantesActuales(cliente);
  if(!firmantesIds.length) return null;
  if(!wizard.mandatariosSeleccionados.length) return null;
  return buildDocumentModel({
    ciudadFirma: wizard.ciudadFirma, fecha: wizard.fecha, tipoMandante:'juridica', cliente,
    firmantes: firmantesIds.map(id=>getRepresentante(cliente,id)),
    mandatarios: wizard.mandatariosSeleccionados.map(getMandatario)
  });
}

function firmantesActuales(cliente){
  if(cliente.formaActuacion==='grupos'){
    const ids = Object.values(wizard.repsGrupo).filter(Boolean);
    return cliente.gruposActuacion.every(g=>wizard.repsGrupo[g.nombre]) ? ids : [];
  }
  if((cliente.formaActuacion==='especial'||cliente.formaActuacion==='incompleta') && !wizard.advertenciaAceptada){
    return [];
  }
  return wizard.repsSeleccionados;
}

/* ============================= WIZARD BINDINGS & VALIDATION ============================= */

function bindStepEvents(){
  if(wizardStep===1){
    makeCombobox(document.getElementById('ciudad-combobox'), {
      items: COMUNAS, getLabel: c=>c.comuna, getSub: c=>c.region,
      placeholder:'Buscar comuna o ciudad...', initialLabel: wizard.ciudadFirma,
      onSelect: c=>{ wizard.ciudadFirma = c.comuna; markInvalid('ciudad', false); updateFechaPreview(); }
    });
    const diaSel = document.getElementById('fecha-dia'), mesSel = document.getElementById('fecha-mes'), anioSel = document.getElementById('fecha-anio');
    for(let d=1; d<=31; d++) diaSel.innerHTML += `<option value="${d}">${d}</option>`;
    MESES.forEach((m,i)=> mesSel.innerHTML += `<option value="${i+1}">${m.charAt(0).toUpperCase()+m.slice(1)}</option>`);
    const thisYear = new Date().getFullYear();
    for(let y=thisYear-1; y<=thisYear+3; y++) anioSel.innerHTML += `<option value="${y}">${y}</option>`;
    if(wizard.fecha){
      const [y,m,d] = wizard.fecha.split('-').map(Number);
      diaSel.value = d; mesSel.value = m; anioSel.value = y;
    }
    [diaSel,mesSel,anioSel].forEach(sel=> sel.addEventListener('change', ()=>{
      if(diaSel.value && mesSel.value && anioSel.value){
        wizard.fecha = `${anioSel.value}-${pad2(+mesSel.value)}-${pad2(+diaSel.value)}`;
        markInvalid('fecha', false);
      } else wizard.fecha = '';
      updateFechaPreview();
    }));
    updateFechaPreview();
  }
  else if(wizardStep===2){
    Array.from(document.querySelectorAll('#tipo-mandante-cards .option-card')).forEach(card=>{
      card.addEventListener('click', ()=>{
        wizard.tipoMandante = card.dataset.tipo;
        Array.from(document.querySelectorAll('#tipo-mandante-cards .option-card')).forEach(c=>c.classList.remove('selected'));
        card.classList.add('selected');
        document.getElementById('mandante-error').style.display = 'none';
      });
    });
  }
  else if(wizardStep===3){
    const box = document.getElementById('cliente-combobox');
    const cliente0 = getCliente(wizard.clienteId);
    makeCombobox(box, {
      items: CLIENTES, getLabel: c=>c.razonSocial, getSub: c=>c.rut,
      placeholder:'Buscar cliente por razón social o RUT...', initialLabel: cliente0? cliente0.razonSocial:'',
      onSelect: c=>{
        wizard.clienteId = c.id;
        autoSelectReps(c);
        markInvalid('cliente', false);
        renderClienteSummary();
      }
    });
    renderClienteSummary();
  }
  else if(wizardStep===4){
    const cliente = getCliente(wizard.clienteId);
    if(!cliente) return;
    if(wizard.tipoMandante==='natural'){
      Array.from(document.querySelectorAll('input[name="natural-rep"]')).forEach(r=>{
        r.addEventListener('change', ()=>{ wizard.naturalPersonId = r.value; document.getElementById('natural-error').style.display='none'; });
      });
    } else {
      const area = document.getElementById('rep-selection-area');
      area.innerHTML = repSelectionAreaHtml(cliente);
      bindRepSelectionEvents(cliente);
    }
    document.getElementById('observaciones-input').addEventListener('input', e=> wizard.observaciones = e.target.value);
  }
  else if(wizardStep===5){
    updateMandatariosChipsAndText();
    Array.from(document.querySelectorAll('.mandatario-checkbox')).forEach(cb=>{
      cb.addEventListener('change', ()=>{
        if(cb.checked) wizard.mandatariosSeleccionados.push(cb.value);
        else wizard.mandatariosSeleccionados = wizard.mandatariosSeleccionados.filter(id=>id!==cb.value);
        markInvalid('mandatarios', false);
        updateMandatariosChipsAndText();
      });
    });
  }
  else if(wizardStep===6){
    const btn = document.getElementById('btn-generar-pdf');
    if(btn) btn.addEventListener('click', onGenerarPdfClick);
  }
}

function bindRepSelectionEvents(cliente){
  const entender = document.getElementById('btn-entender');
  const rechazar = document.getElementById('btn-rechazar');
  const revert = document.getElementById('btn-revert-advertencia');
  if(entender) entender.addEventListener('click', ()=>{
    wizard.advertenciaAceptada = true;
    logInternalAudit(cliente, 'Advertencia de forma de actuación aceptada por el usuario.');
    document.getElementById('rep-selection-area').innerHTML = repSelectionAreaHtml(cliente);
    bindRepSelectionEvents(cliente);
  });
  if(rechazar) rechazar.addEventListener('click', ()=>{
    wizard.advertenciaRechazada = true;
    logInternalAudit(cliente, 'Advertencia de forma de actuación rechazada por el usuario.');
    document.getElementById('rep-selection-area').innerHTML = repSelectionAreaHtml(cliente);
    bindRepSelectionEvents(cliente);
  });
  if(revert) revert.addEventListener('click', ()=>{
    wizard.advertenciaRechazada = false;
    document.getElementById('rep-selection-area').innerHTML = repSelectionAreaHtml(cliente);
    bindRepSelectionEvents(cliente);
  });
  Array.from(document.querySelectorAll('.free-rep-checkbox')).forEach(cb=>{
    cb.addEventListener('change', ()=>{
      const exact = cb.dataset.exact ? parseInt(cb.dataset.exact,10) : null;
      if(cb.checked){
        if(exact && wizard.repsSeleccionados.length >= exact){
          cb.checked = false; return;
        }
        wizard.repsSeleccionados.push(cb.value);
      } else {
        wizard.repsSeleccionados = wizard.repsSeleccionados.filter(id=>id!==cb.value);
      }
    });
  });
  Array.from(document.querySelectorAll('[data-grupo]')).forEach(r=>{
    r.addEventListener('change', ()=>{ wizard.repsGrupo[r.dataset.grupo] = r.value; });
  });
}

const internalAuditLog = [];
function logInternalAudit(cliente, mensaje){
  internalAuditLog.push({ ts:new Date().toISOString(), usuario:CURRENT_USER, cliente:cliente.razonSocial, mensaje });
}

function updateFechaPreview(){
  const box = document.getElementById('fecha-preview');
  if(!box) return;
  if(wizard.ciudadFirma && wizard.fecha){
    box.style.display='flex';
    box.innerHTML = `${iconSvg('info')}<div>Se imprimirá como: <b>"En ${escapeHtml(wizard.ciudadFirma)}, a ${escapeHtml(fechaTextoFromISO(wizard.fecha))}."</b></div>`;
  } else box.style.display='none';
}

function renderClienteSummary(){
  const box = document.getElementById('cliente-summary');
  if(!box) return;
  const cliente = getCliente(wizard.clienteId);
  if(!cliente){ box.innerHTML=''; return; }
  box.innerHTML = `<div class="summary-box">
    <dl class="summary-grid">
      <div><dt>Razón social</dt><dd>${escapeHtml(cliente.razonSocial)}</dd></div>
      <div><dt>RUT empresa</dt><dd>${cliente.rut}</dd></div>
      <div><dt>Giro</dt><dd>${escapeHtml(cliente.giro)}</dd></div>
      <div><dt>Domicilio</dt><dd>${escapeHtml(cliente.domicilio)}</dd></div>
      <div><dt>Comuna</dt><dd>${escapeHtml(cliente.comuna)}</dd></div>
      <div><dt>Ciudad / Región</dt><dd>${escapeHtml(cliente.ciudad)} · ${escapeHtml(cliente.region)}</dd></div>
    </dl>
    <div class="rep-list" style="margin-top:14px;">
      ${cliente.representantes.map(r=>`<div class="rep-row locked">
        <span class="rep-name">${donDona(r.genero)} ${escapeHtml(r.nombre)}</span>
        <span class="rep-rut">${r.rut}</span>
      </div>`).join('')}
    </div>
    <div class="field-hint" style="margin-top:8px;">Forma de actuación: <b>${FORMA_ACTUACION_LABELS[cliente.formaActuacion]}</b></div>
  </div>
  ${duplicateNoticeHtml(cliente)}`;
}

function duplicateNoticeHtml(cliente){
  const vigente = vigenteDe(cliente.id);
  if(!vigente || wizard.modoNuevaVersion) return '';
  return `<div class="banner banner-info">${iconSvg('info')}<div>Ya existe un Poder SII vigente para este cliente (v${vigente.version}, ${fechaCortaFromISO(vigente.fechaISO)}, creado por ${escapeHtml(vigente.usuario)}). Podrás revisarlo o generar una nueva versión al finalizar.</div></div>`;
}

function updateMandatariosChipsAndText(){
  const chipsBox = document.getElementById('mandatarios-chips');
  const textBox = document.getElementById('mandatarios-text-preview');
  const seleccionados = wizard.mandatariosSeleccionados.map(getMandatario);
  chipsBox.innerHTML = seleccionados.map(m=>`<span class="chip">${escapeHtml(m.nombre)} <button data-remove="${m.id}">${iconSvg('x')}</button></span>`).join('');
  Array.from(chipsBox.querySelectorAll('[data-remove]')).forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.dataset.remove;
      wizard.mandatariosSeleccionados = wizard.mandatariosSeleccionados.filter(x=>x!==id);
      const cb = document.querySelector(`.mandatario-checkbox[value="${id}"]`);
      if(cb) cb.checked = false;
      updateMandatariosChipsAndText();
    });
  });
  textBox.textContent = seleccionados.length ? buildPersonListText(seleccionados) : 'Selecciona al menos un mandatario para ver la redacción automática.';
}

function validateCurrentStep(){
  if(wizardStep===1){
    let ok = true;
    if(!wizard.ciudadFirma){ markInvalid('ciudad', true); ok=false; }
    if(!wizard.fecha){ markInvalid('fecha', true); ok=false; }
    return ok;
  }
  if(wizardStep===2){
    if(!wizard.tipoMandante){ document.getElementById('mandante-error').style.display='block'; return false; }
    return true;
  }
  if(wizardStep===3){
    if(!wizard.clienteId){ markInvalid('cliente', true); return false; }
    return true;
  }
  if(wizardStep===4){
    const cliente = getCliente(wizard.clienteId);
    if(!cliente) return false;
    if(wizard.tipoMandante==='natural'){
      if(!wizard.naturalPersonId){ document.getElementById('natural-error').style.display='block'; return false; }
      return true;
    }
    if(wizard.advertenciaRechazada){
      showToast('Debes resolver la advertencia (Entiendo y continuar) o seleccionar otro cliente.', true);
      return false;
    }
    const firmantes = firmantesActuales(cliente);
    if(!firmantes.length){
      showToast('Debes seleccionar al menos un representante legal.', true);
      return false;
    }
    if(cliente.formaActuacion==='dos_de_n' && firmantes.length !== (cliente.minRequeridos||2)){
      showToast(`Debes seleccionar exactamente ${cliente.minRequeridos||2} representantes.`, true);
      return false;
    }
    if(cliente.formaActuacion==='conjunta' && firmantes.length !== cliente.representantes.length){
      showToast('La actuación conjunta requiere a todos los representantes.', true);
      return false;
    }
    return true;
  }
  if(wizardStep===5){
    if(!wizard.mandatariosSeleccionados.length){ markInvalid('mandatarios', true); return false; }
    return true;
  }
  return true;
}

function onWizardNext(){
  if(!validateCurrentStep()) return;
  if(wizardStep < TOTAL_STEPS){ wizardStep++; renderWizardStep(); }
}

/* ============================= PDF GENERATION FLOW ============================= */

function onGenerarPdfClick(){
  const model = currentDocumentModel();
  if(!model){ showToast('Faltan datos esenciales. No es posible generar el PDF.', true); return; }
  const cliente = getCliente(wizard.clienteId);
  const vigente = vigenteDe(cliente.id);
  if(vigente && !wizard.modoNuevaVersion){
    openDuplicateModal(cliente, vigente, model);
  } else {
    finalizarGeneracion(cliente, model);
  }
}

function openDuplicateModal(cliente, vigente, model){
  const root = document.getElementById('modal-root');
  root.innerHTML = `<div class="modal-overlay">
    <div class="modal">
      <h3>Ya existe un Poder SII para este cliente</h3>
      <p>Ya existe un Poder SII generado para <b>${escapeHtml(cliente.razonSocial)}</b> con fecha ${fechaCortaFromISO(vigente.fechaISO)}, creado por ${escapeHtml(vigente.usuario)}. Puedes cancelar, ver el poder anterior o generar una nueva versión.</p>
      <div class="modal-actions">
        <button class="btn btn-primary" id="modal-nueva-version">Generar nueva versión</button>
        <button class="btn btn-secondary" id="modal-ver-anterior">Ver poder anterior</button>
        <button class="btn btn-ghost" id="modal-cancelar">Cancelar</button>
      </div>
    </div>
  </div>`;
  document.getElementById('modal-cancelar').addEventListener('click', closeModal);
  document.getElementById('modal-ver-anterior').addEventListener('click', ()=>{ openPdfInNewTab(vigente.pdfBase64); closeModal(); });
  document.getElementById('modal-nueva-version').addEventListener('click', ()=>{ closeModal(); finalizarGeneracion(cliente, model); });
}

function closeModal(){ document.getElementById('modal-root').innerHTML=''; }

function finalizarGeneracion(cliente, model){
  const base64 = pdfBase64FromModel(model);
  const versiones = poderesStore[cliente.id] || [];
  versiones.forEach(v=> v.estado = 'archivado');
  const nextVersion = versiones.length ? Math.max(...versiones.map(v=>v.version))+1 : 1;
  const fileName = `Poder_SII_${cliente.razonSocial.replace(/[^a-zA-Z0-9]+/g,'_')}_v${nextVersion}.pdf`;
  const record = {
    id: uid(), version: nextVersion, fechaISO: wizard.fecha, usuario: CURRENT_USER, estado:'vigente',
    mandatarios: wizard.mandatariosSeleccionados.map(getMandatario).map(m=>({nombre:m.nombre, rut:m.rut})),
    observaciones: wizard.observaciones || '', eliminado:false, pdfBase64: base64, fileName
  };
  poderesStore[cliente.id] = [...versiones, record];
  saveStore();
  triggerDownload(blobFromBase64Pdf(base64), fileName);
  showToast(`Poder SII generado y descargado (${fileName}).`);
  showView('poderes-generados');
}

/* ============================= PODERES GENERADOS VIEW ============================= */

let poderesSearchTerm = '';

function renderPoderesGenerados(){
  const clientesConPoder = CLIENTES.filter(c => (poderesStore[c.id]||[]).some(v=>!v.eliminado));
  const filtered = clientesConPoder.filter(c => normalize(c.razonSocial).includes(normalize(poderesSearchTerm)));
  return `
  <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;">
    <div><h1 class="page-title">Poderes Generados</h1><p class="page-subtitle">Poderes SII generados, ordenados por cliente.</p></div>
    <button class="btn btn-ghost btn-sm" onclick="resetDemoData()">${iconSvg('refresh')} Restablecer datos de ejemplo</button>
  </div>
  <div class="search-bar">
    ${iconSvg('search')}
    <input type="text" id="poderes-search" placeholder="Buscar cliente..." value="${escapeHtml(poderesSearchTerm)}">
  </div>
  <div id="poderes-list">${filtered.length ? filtered.map(clienteFolderHtml).join('') : `<div class="card"><div class="empty-state">${iconSvg('archive')}<p>No hay poderes generados que coincidan con la búsqueda.</p></div></div>`}</div>
  `;
}

function clienteFolderHtml(cliente){
  const vigente = vigenteDe(cliente.id);
  const archivadas = archivadasDe(cliente.id);
  return `<div class="client-folder">
    <div class="client-folder-head">
      <div>
        <h3>${escapeHtml(cliente.razonSocial)}</h3>
        <div class="poder-meta">
          <span>RUT: ${cliente.rut}</span>
          ${vigente ? `<span class="pill pill-vigente">Vigente</span> <span>Versión ${vigente.version}</span> <span>Fecha: ${fechaCortaFromISO(vigente.fechaISO)}</span> <span>Creado por: ${escapeHtml(vigente.usuario)}</span>` : `<span>Sin poder vigente</span>`}
        </div>
      </div>
    </div>
    ${vigente ? `<div class="field-hint" style="margin-top:8px;">Mandatarios incluidos: ${vigente.mandatarios.map(m=>escapeHtml(m.nombre)).join(', ')}</div>` : ''}
    <div class="poder-actions">
      ${vigente ? `
        <button class="btn btn-secondary btn-sm" onclick="verPdf('${cliente.id}','${vigente.id}')">${iconSvg('eye')} Ver PDF</button>
        <button class="btn btn-secondary btn-sm" onclick="descargarPdf('${cliente.id}','${vigente.id}')">${iconSvg('download')} Descargar</button>
        <button class="btn btn-secondary btn-sm" onclick="generarNuevaVersion('${cliente.id}')">${iconSvg('plusCircle')} Generar nueva versión</button>
        <button class="btn btn-danger btn-sm" onclick="confirmarEliminar('${cliente.id}','${vigente.id}')">${iconSvg('trash')} Eliminar</button>
      ` : `<button class="btn btn-primary btn-sm" onclick="showView('generar-poder',{prefillClientId:'${cliente.id}'})">${iconSvg('plusCircle')} Generar Poder SII</button>`}
    </div>
    ${archivadas.length ? `
      <div class="versions-toggle" onclick="toggleVersiones('${cliente.id}')">
        <span id="versiones-arrow-${cliente.id}">▸</span> Ver versiones anteriores (${archivadas.length})
      </div>
      <div class="versions-panel hidden" id="versiones-panel-${cliente.id}">
        ${archivadas.map(v=>`
          <div class="version-row">
            <div>Versión ${v.version} · Fecha: ${fechaCortaFromISO(v.fechaISO)} · Creado por: ${escapeHtml(v.usuario)} · <span class="pill pill-archivado">Archivado</span></div>
            <button class="btn btn-secondary btn-sm" onclick="verPdf('${cliente.id}','${v.id}')">${iconSvg('eye')} Ver PDF</button>
          </div>`).join('')}
      </div>` : ''}
  </div>`;
}

function toggleVersiones(clienteId){
  const panel = document.getElementById('versiones-panel-'+clienteId);
  const arrow = document.getElementById('versiones-arrow-'+clienteId);
  panel.classList.toggle('hidden');
  arrow.textContent = panel.classList.contains('hidden') ? '▸' : '▾';
}

function findRecord(clienteId, recordId){
  return (poderesStore[clienteId]||[]).find(v=>v.id===recordId);
}
function verPdf(clienteId, recordId){
  const r = findRecord(clienteId, recordId);
  if(r) openPdfInNewTab(r.pdfBase64);
}
function descargarPdf(clienteId, recordId){
  const r = findRecord(clienteId, recordId);
  if(r) triggerDownload(blobFromBase64Pdf(r.pdfBase64), r.fileName);
}
function generarNuevaVersion(clienteId){
  showView('generar-poder', { prefillClientId: clienteId });
}
function confirmarEliminar(clienteId, recordId){
  const cliente = getCliente(clienteId);
  const root = document.getElementById('modal-root');
  root.innerHTML = `<div class="modal-overlay">
    <div class="modal">
      <h3>¿Eliminar este Poder SII?</h3>
      <p>¿Estás seguro de que deseas eliminar el poder vigente de <b>${escapeHtml(cliente.razonSocial)}</b>? Esta acción debe quedar registrada. El documento quedará marcado como eliminado y no será visible en la vista principal, conservando trazabilidad interna.</p>
      <div class="modal-actions">
        <button class="btn btn-danger" id="confirm-delete">Sí, eliminar</button>
        <button class="btn btn-ghost" id="cancel-delete">Cancelar</button>
      </div>
    </div>
  </div>`;
  document.getElementById('cancel-delete').addEventListener('click', closeModal);
  document.getElementById('confirm-delete').addEventListener('click', ()=>{
    const r = findRecord(clienteId, recordId);
    if(r){
      r.eliminado = true;
      internalAuditLog.push({ ts:new Date().toISOString(), usuario:CURRENT_USER, cliente:cliente.razonSocial, mensaje:`Eliminación (lógica) de Poder SII v${r.version}.` });
      saveStore();
    }
    closeModal();
    showToast('Poder SII eliminado. Queda registrado internamente para trazabilidad.');
    showView('poderes-generados');
  });
}

function resetDemoData(){
  seedStore();
  showToast('Datos de ejemplo restablecidos.');
  showView('poderes-generados');
}

document.addEventListener('input', e=>{
  if(e.target && e.target.id==='poderes-search'){
    poderesSearchTerm = e.target.value;
    document.getElementById('poderes-list').innerHTML = (()=>{
      const clientesConPoder = CLIENTES.filter(c => (poderesStore[c.id]||[]).some(v=>!v.eliminado));
      const filtered = clientesConPoder.filter(c => normalize(c.razonSocial).includes(normalize(poderesSearchTerm)));
      return filtered.length ? filtered.map(clienteFolderHtml).join('') : `<div class="card"><div class="empty-state">${iconSvg('archive')}<p>No hay poderes generados que coincidan con la búsqueda.</p></div></div>`;
    })();
  }
});

/* ============================= TOAST ============================= */

function showToast(msg, isError){
  const root = document.getElementById('toast-root');
  root.innerHTML = `<div class="toast" style="${isError?'background:#7f1d1d;':''}">${iconSvg(isError?'alert':'check')}<span>${escapeHtml(msg)}</span></div>`;
  setTimeout(()=>{ root.innerHTML=''; }, 4200);
}

/* ============================= INIT ============================= */

Array.from(document.querySelectorAll('.side-icon')).forEach(btn=>{
  btn.addEventListener('click', ()=> showView(btn.dataset.view));
});

if(!loadStore()) seedStore();
setTimeout(()=>{ const p = document.getElementById('folder-pulse'); if(p) p.remove(); }, 6000);
showView('home');
</script>
